<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Salon Copy</title>
<meta name="description" content="The salon’s cash copy: every payment, cash and online, on every staff phone.">
<meta name="theme-color" content="#14264D" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1630" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Salon Copy">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@400;500;600;700&family=Anek+Devanagari:wght@400;500;600;700&family=Anek+Odia:wght@400;500;600;700&family=Kalam:wght@400;700&display=swap">
<style>
/* The salon's cash copy on a phone: navy notebook cover above, ruled page below,
   amounts in ballpoint blue. Green always means cash, blue always means Paytm. */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --cover:#14264D; --cover-2:#213B72; --cover-line:#304C8A; --on-cover:#F5F7FF; --on-cover-2:#B4C1E0;
  --gold:#FFC233; --gold-ink:#2C2007;
  --paper:#FDFDF9; --paper-2:#F0F2EC; --paper-3:#E3E7DF; --rule:#D3DCEA; --margin:#EC9C9C; --line:#D8DEE7;
  --ink:#16213F; --ink-2:#56617C; --ink-3:#8790A8;
  --pen:#1C3FAA;
  --btn:#14264D; --on-btn:#F5F7FF;
  --cash:#0B7A42; --cash-bg:#E2F3E9; --on-cash:#FFFFFF;
  --ptm:#0A62C6; --ptm-bg:#E1EDFB; --on-ptm:#FFFFFF;
  --out:#BF312A; --out-bg:#FBE8E6; --on-out:#FFFFFF;
  --hl:rgba(255,194,51,.45);
  --ui:"Anek Latin","Anek Devanagari","Anek Odia",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari","Noto Sans Oriya",sans-serif;
  --hand:"Kalam","Anek Devanagari","Anek Odia","Segoe Print","Bradley Hand",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --cover:#0B1630; --cover-2:#17284F; --cover-line:#253A68; --on-cover:#F1F5FF; --on-cover-2:#A1AFD3;
    --paper:#141A26; --paper-2:#1E2636; --paper-3:#283246; --rule:#273247; --margin:#8C484C; --line:#2C374B;
    --ink:#E9EEFA; --ink-2:#A9B3CA; --ink-3:#75819B;
    --pen:#A5BDFF;
    --btn:#2B417B; --on-btn:#F5F7FF;
    --cash:#5BD08F; --cash-bg:#163222; --on-cash:#05200F;
    --ptm:#78B6FF; --ptm-bg:#14273F; --on-ptm:#04172E;
    --out:#FF8F85; --out-bg:#3B1D1B; --on-out:#3A0B07;
    --hl:rgba(255,194,51,.28);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --cover:#0B1630; --cover-2:#17284F; --cover-line:#253A68; --on-cover:#F1F5FF; --on-cover-2:#A1AFD3;
  --paper:#141A26; --paper-2:#1E2636; --paper-3:#283246; --rule:#273247; --margin:#8C484C; --line:#2C374B;
  --ink:#E9EEFA; --ink-2:#A9B3CA; --ink-3:#75819B;
  --pen:#A5BDFF;
  --btn:#2B417B; --on-btn:#F5F7FF;
  --cash:#5BD08F; --cash-bg:#163222; --on-cash:#05200F;
  --ptm:#78B6FF; --ptm-bg:#14273F; --on-ptm:#04172E;
  --out:#FF8F85; --out-bg:#3B1D1B; --on-out:#3A0B07;
  --hl:rgba(255,194,51,.28);
}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--cover);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;display:flex;flex-direction:column;background:var(--cover);color:var(--ink);
  font-family:var(--ui);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
:root:lang(hi) body,:root:lang(or) body{line-height:1.55}
button,input,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button[disabled]{cursor:default}
h1,h2,p,dl,dd,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
svg{flex:none}
html.has-sheet,html.has-sheet body{overflow:hidden}
#app{flex:1;display:flex;flex-direction:column;width:100%;max-width:540px;margin:0 auto}
.hand{font-family:var(--hand);font-weight:700}

/* avatars */
.av{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--av,#6B7AA6);color:#fff;
  font-weight:700;font-size:13.5px;line-height:1;letter-spacing:-.02em}
.av.lg{width:46px;height:46px;font-size:19px}
.av.ghost{background:var(--paper-2);color:var(--ink-2)}
.cover .av.ghost{background:var(--cover-line);color:var(--on-cover)}

/* ── cover ── */
.cover{color:var(--on-cover);padding:10px 16px 34px}
.cv-top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.cv-right{display:flex;gap:8px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 13px;border-radius:20px;background:var(--cover-2);color:var(--on-cover);
  font-size:14.5px;font-weight:600;flex:none;white-space:nowrap}
.me-chip{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 10px 0 7px;border-radius:22px;background:var(--cover-2);min-width:0;max-width:66%}
.me-chip .me-n{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv-name{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cv-date{margin-top:12px}
.cv-date .hand{position:relative;display:inline-block;font-size:46px;line-height:1;padding-bottom:12px}
.cv-date .hand svg{position:absolute;left:-2%;bottom:0;width:106%;height:11px;color:var(--gold)}
.cv-week{margin-top:6px;font-size:15.5px;color:var(--on-cover-2)}
.cv-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--cover-line)}
.cv-strip dt{font-size:13px;color:var(--on-cover-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv-strip dd{margin-top:1px;font-size:20px;font-weight:700;white-space:nowrap}
.cv-strip .hi dd{color:var(--gold)}
.cv-h1{font-size:28px;font-weight:700;line-height:1.2;margin-top:14px}
.cv-sub{margin-top:6px;font-size:15.5px;color:var(--on-cover-2)}

/* ── paper ── */
.paper{flex:1;position:relative;background:var(--paper);border-radius:22px 22px 0 0;margin-top:-18px;padding:18px 16px 100px}
.paper.bare{padding-bottom:28px}
.mine{display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:600;color:var(--ink-2);margin:0 2px 10px}


/* the ruled page: every row is exactly one rule tall, so writing sits on the lines */
.ledger{--row:38px;position:relative;margin:22px -16px 0;padding:0 16px 0 32px;border-top:2px solid var(--margin);
  background-image:linear-gradient(to bottom,transparent calc(var(--row) - 1px),var(--rule) calc(var(--row) - 1px));background-size:100% var(--row)}
.ledger::before{content:"";position:absolute;top:0;bottom:0;left:21px;width:1.5px;background:var(--margin)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));column-gap:10px}
.col{min-width:0}
.col-h{height:var(--row);display:flex;align-items:flex-end;gap:6px;padding-bottom:5px;font-weight:700;font-size:15.5px;line-height:1.1;min-width:0}
.col-h span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-h .left{font-weight:500;font-size:12px;color:var(--ink-3)}
.amt-line{display:flex;align-items:flex-end;gap:3px;width:100%;height:var(--row);padding:0 0 3px;font-family:var(--hand);font-weight:700;
  font-size:22px;line-height:1;color:var(--pen);white-space:nowrap;overflow:hidden}
.amt-line .p{font-size:14px;font-weight:400;padding-bottom:2px}
.mk{align-self:center;flex:none;margin-left:4px;display:grid;place-items:center;width:19px;height:19px;border-radius:50%;font-family:var(--ui);font-size:12px;font-weight:700;line-height:1}
.mk.q{border:1.5px solid var(--out);color:var(--out)}
.mk.w{color:var(--ink-3)}
.void .a,.void .p,.lg-row.void .vl,.lg-row.void .lb>span{text-decoration:line-through;text-decoration-thickness:2px;opacity:.5}
.col-t{height:var(--row);display:flex;align-items:flex-end;padding-bottom:3px;border-top:2px solid var(--ink);width:88%;
  font-family:var(--hand);font-weight:700;font-size:22px;line-height:1;color:var(--ink)}
.lg-gap{height:var(--row)}
.lg-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;width:100%;height:var(--row);padding-bottom:4px}
.lg-row .lb{display:flex;align-items:flex-end;gap:6px;min-width:0;font-size:15.5px;line-height:1.15;color:var(--ink-2)}
.lg-row .lb>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-row .lb i{font-style:normal;color:var(--ink-3);white-space:nowrap}
.lg-row .vl{flex:none;font-family:var(--hand);font-weight:700;font-size:22px;line-height:1;color:var(--pen);white-space:nowrap}
.lg-row.out .vl{color:var(--out)}
.lg-row.sum{border-top:2px solid var(--ink)}
.lg-row.sum .lb{color:var(--ink);font-weight:600}
.lg-row.final{height:calc(var(--row)*2);padding-bottom:9px;border-top:2px solid var(--ink);border-bottom:4px double var(--ink)}
.lg-row.final .lb{font-size:17.5px;font-weight:700;color:var(--ink)}
.lg-row.final .vl{font-size:36px;color:var(--ink)}
.lg-row.good .lb,.lg-row.good .vl{color:var(--cash);font-weight:700}
.lg-row.bad .lb,.lg-row.bad .vl{color:var(--out);font-weight:700}
.lg-row.muted .lb{color:var(--ink-3)}
.lg-row .vl svg{vertical-align:-3px}
.fresh{animation:hl 1.8s ease-out}
.fresh .a,.fresh .p,.fresh .vl{animation:write .6s ease-out both}
@keyframes write{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 -8px 0 0)}}
@keyframes hl{0%,55%{background-color:var(--hl)}100%{background-color:transparent}}

.stamp-row{display:flex;justify-content:flex-end;padding:18px 6px 0}
.stamp{display:inline-flex;flex-direction:column;align-items:center;gap:1px;padding:7px 16px 6px;border:2.5px solid currentColor;border-radius:10px;
  color:var(--pen);transform:rotate(-5deg);font-weight:700;font-size:18px;letter-spacing:.08em;line-height:1.2;opacity:.92}
:root:lang(hi) .stamp,:root:lang(or) .stamp{letter-spacing:.02em}
.stamp small{font-size:12.5px;font-weight:600;letter-spacing:.01em}
.stamp.bad{color:var(--out)}
.stamp.thunk{animation:thunk .38s cubic-bezier(.2,1.5,.4,1) both}
.done .stamp{font-size:30px;padding:10px 26px 9px;border-width:3.5px;border-radius:14px}
.done .stamp small{font-size:15px}
@keyframes thunk{from{transform:rotate(-5deg) scale(1.7);opacity:0}to{transform:rotate(-5deg) scale(1);opacity:.92}}

.count-btn{margin-top:24px}
.row-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.legend{margin-top:18px;font-size:14px;color:var(--ink-2)}
.modeline{display:flex;gap:7px;align-items:flex-start;margin-top:8px;font-size:13.5px;color:var(--ink-3)}
.modeline svg{margin-top:2px}

.note{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:14px;background:var(--paper-2);font-size:15.5px}
.note>svg{margin-top:2px;color:var(--pen)}
.note b{font-weight:600}
.note p{margin-top:4px;color:var(--ink-2)}
.note.bad{background:var(--out-bg)}
.note.bad>svg{color:var(--out)}
.note.warn{background:#FFF3D1;color:#4A3504}
.note.warn>svg{color:#A06A00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .note.warn{background:#3A2E10;color:#FFE3A1}}
:root[data-theme="dark"] .note.warn{background:#3A2E10;color:#FFE3A1}
.note-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.note+.note,.note+.cta,.note+.mine{margin-top:12px}
.notes-stack{display:grid;gap:10px;margin-bottom:14px}

/* ── buttons, chips, inputs ── */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:8px 16px;border-radius:16px;
  font-weight:700;font-size:17px;text-align:center;line-height:1.25}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.navy{background:var(--btn);color:var(--on-btn)}
.btn.red{background:var(--out);color:var(--on-out)}
.btn.green{background:var(--cash);color:var(--on-cash)}
.btn.line{border:1.5px solid var(--line);color:var(--ink)}
.btn.ghost{border:1.5px solid var(--cover-line);color:var(--on-cover)}
.btn.sm{min-height:48px;font-size:16px;border-radius:14px}
.btn[disabled]{background:var(--paper-2);color:var(--ink-3);border-color:transparent}
.btn.dim{opacity:.45}
.btn:not([disabled]):active{filter:brightness(.93)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:2px 0}
.chip{display:inline-flex;align-items:center;gap:6px;flex:none;min-height:44px;padding:4px 15px;border-radius:22px;border:1.5px solid var(--line);
  background:var(--paper);font-weight:600;font-size:15.5px;white-space:nowrap}
.chip .av{width:28px;height:28px;font-size:12.5px;margin-left:-9px}
.chip.on{background:var(--btn);border-color:var(--btn);color:var(--on-btn)}
.chip.q{font-family:var(--hand);font-size:19px;color:var(--pen);padding-top:6px}
.chip.danger{color:var(--out);border-color:var(--out)}
.chip.sm{min-height:38px;font-size:14.5px;padding:2px 12px}
.chip:active{background:var(--paper-2)}
.chip.on:active{background:var(--btn)}
.chip.need{animation:need .5s}
@keyframes need{20%,60%{border-color:var(--out);box-shadow:0 0 0 3px var(--out-bg)}}
.link{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 4px;font-weight:600;font-size:15.5px;color:var(--pen);text-decoration:underline;text-underline-offset:3px}
.inp{width:100%;height:54px;padding:0 14px;border-radius:13px;border:1.5px solid var(--line);background:var(--paper);font-size:17.5px;min-width:0}
.inp.big{height:60px;font-size:20px;font-weight:600}
.inp:focus{outline:none;border-color:var(--pen);box-shadow:0 0 0 3px var(--hl)}
.f-row{display:flex;gap:8px;align-items:center}
.f-row .inp{flex:1}
.f-row .btn{width:auto;flex:none;min-height:54px}
.err{color:var(--out);font-weight:600;font-size:15px;margin:8px 2px}
.lbl{font-size:14.5px;font-weight:600;color:var(--ink-2);margin:0 2px 7px}

/* ── bottom tabs ── */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:var(--paper);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:540px}
.tab{position:relative;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13.5px;font-weight:500;color:var(--ink-3)}
.tab.on{color:var(--pen);font-weight:700}
.tab.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--pen)}
.tab .dot{position:absolute;top:10px;left:calc(50% + 9px);width:9px;height:9px;border-radius:50%;background:var(--out)}

/* ── sheets ── */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(6,12,30,.62);
  padding-top:env(safe-area-inset-top,0px)}
.sheet{width:100%;max-width:540px;max-height:100%;overflow-y:auto;overscroll-behavior:contain;background:var(--paper);color:var(--ink);border-radius:22px 22px 0 0;
  padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
.sheet:focus{outline:none}
.sheet.tall{height:100%;max-height:860px;display:flex;flex-direction:column}
@keyframes up{from{transform:translateY(28px);opacity:.3}to{transform:none;opacity:1}}
.sh-head{display:flex;align-items:center;gap:10px;min-height:48px;margin-bottom:6px}
.sh-title{flex:1;min-width:0;font-size:20px;font-weight:700;line-height:1.2}
.x{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--paper-2)}
.warn-line{display:flex;gap:8px;align-items:flex-start;padding:9px 12px;margin-bottom:10px;border-radius:12px;background:#FFF3D1;color:#4A3504;font-size:14.5px;font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .warn-line{background:#3A2E10;color:#FFE3A1}}
:root[data-theme="dark"] .warn-line{background:#3A2E10;color:#FFE3A1}
.amt-big{display:flex;align-items:baseline;justify-content:center;gap:6px;min-height:68px;font-family:var(--hand);font-weight:700;font-size:56px;
  line-height:1.15;color:var(--pen)}
.amt-big .r{font-family:var(--ui);font-weight:500;font-size:28px;opacity:.6}
.amt-big.empty .n{opacity:.22}
.amt-big.out{color:var(--out)}
.amt-big.void .n{text-decoration:line-through;opacity:.5}
.amt-big.shake{animation:shake .32s}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:8px;flex:1 1 auto;min-height:200px;max-height:300px;margin:10px 0 12px}
.sheet:not(.tall) .keypad{min-height:250px}
.key{display:grid;place-items:center;min-height:44px;border-radius:14px;background:var(--paper-2);font-size:27px;font-weight:600;line-height:1}
.key:active{background:var(--paper-3)}
.sub-acts{display:flex;justify-content:center;margin-top:6px}
.hint{min-height:22px;text-align:center;font-weight:600;font-size:15px;color:var(--out);margin-top:6px}
.lock-note{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px;font-size:13.5px;color:var(--ink-2);text-align:center}
.confirm{padding:14px;border-radius:16px;background:var(--paper-2);text-align:center}
.confirm p{font-size:17px;font-weight:700;margin-bottom:12px}
.confirm .btn-row .btn{min-height:54px}
.save{margin-top:10px}
.box{padding:12px 14px;border-radius:14px;background:var(--paper-2)}
.box-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;min-height:38px}
.box-row span{font-size:15.5px;font-weight:600;color:var(--ink-2)}
.box-row b{font-family:var(--hand);font-size:28px;line-height:1.1;color:var(--pen);white-space:nowrap}
.box-row.big b{font-size:34px}
.box-row.good span,.box-row.good b{color:var(--cash)}
.box-row.bad span,.box-row.bad b{color:var(--out)}
.box hr{border:0;border-top:2px solid var(--ink);margin:4px 0}
.why{margin-top:10px;font-size:14.5px;color:var(--ink-2)}
.ask{font-size:17px;font-weight:600;margin:6px 2px 0;text-align:center}
.done{display:flex;flex-direction:column;align-items:center;gap:20px;padding:24px 0 8px;flex:1;justify-content:center}
.done-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;text-align:center}
.done-nums small{display:block;font-size:13px;color:var(--ink-2)}
.done-nums b{font-size:19px;font-weight:700;white-space:nowrap}
.done-acts{display:grid;gap:10px;width:100%}
.done p{text-align:center;color:var(--ink-2);font-size:15px}
.pin-dots{display:flex;justify-content:center;gap:18px;margin:16px 0 10px}
.pin-dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink-2)}
.pin-dots i.on{background:var(--ink);border-color:var(--ink)}
.pin-dots.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pin-msg{text-align:center;min-height:24px;font-size:15.5px;color:var(--ink-2)}
.pin-msg.bad{color:var(--out);font-weight:700}
.e-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:4px}
.tag{display:inline-flex;align-items:center;gap:5px;min-height:32px;padding:2px 13px;border-radius:16px;background:var(--paper-2);font-weight:600;font-size:15px}
.tag.cash{background:var(--cash);color:var(--on-cash)} .tag.ptm{background:var(--ptm);color:var(--on-ptm)} .tag.out{background:var(--out);color:var(--on-out)}
.facts{margin-top:14px;display:grid;gap:6px}
.fact{display:flex;align-items:flex-start;gap:9px;font-size:15px;color:var(--ink-2)}
.fact svg{margin-top:2px}
.fact.bad{color:var(--out);font-weight:600}
.fact.good{color:var(--cash);font-weight:600}
.e-sec{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.e-q{font-weight:600;margin-bottom:10px}
.e-acts{display:grid;gap:10px}
.notes-grid{display:grid;gap:8px;margin:6px 0 12px}
.nrow{display:grid;grid-template-columns:76px 1fr 96px;align-items:center;gap:10px}
.nrow b{font-weight:700;font-size:18px}
.nrow .inp{height:50px;text-align:center;font-size:19px}
.nrow span{text-align:right;font-family:var(--hand);font-weight:700;font-size:21px;color:var(--pen);white-space:nowrap}
.ntot{display:flex;justify-content:space-between;align-items:baseline;padding:10px 2px;border-top:2px solid var(--ink);font-weight:700}
.ntot b{font-family:var(--hand);font-size:30px;color:var(--pen)}
.ta{width:100%;min-height:180px;margin:4px 0 12px;padding:12px;border-radius:13px;border:1.5px solid var(--line);background:var(--paper-2);font-size:15px;color:inherit}
.steps{display:grid;gap:14px;margin:6px 0 18px}
.steps li{display:flex;gap:12px;align-items:flex-start;font-size:16px}
.steps .tn{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--btn);color:var(--on-btn);font-weight:700}

/* who */
.who-list{display:grid;gap:10px}
.who-btn{display:flex;align-items:center;gap:14px;width:100%;min-height:70px;padding:10px 14px;border-radius:18px;background:var(--paper-2);text-align:left}
.who-btn:active{background:var(--paper-3)}
.who-btn.on{outline:2.5px solid var(--pen)}
.who-n{flex:1;min-width:0;font-size:19px;font-weight:700;line-height:1.2}
.who-n small{display:block;font-size:14px;font-weight:500;color:var(--ink-2)}
.who-sep{height:1px;background:var(--line);margin:6px 0}
.who-btn>svg:last-child{color:var(--pen)}

/* lang screen */
.lang-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:30px 22px calc(30px + env(safe-area-inset-bottom,0px));color:var(--on-cover)}
.logo{font-family:var(--hand);font-weight:700;font-size:44px;line-height:1.1;position:relative;display:inline-block;align-self:flex-start;padding-bottom:10px}
.logo svg{position:absolute;left:-2%;bottom:0;width:104%;height:11px;color:var(--gold)}
.lang-ask{font-size:19px;font-weight:600;color:var(--on-cover-2);line-height:1.5;margin:6px 0 4px}
.lang-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:78px;padding:12px 18px;border-radius:18px;background:var(--cover-2);color:var(--on-cover)}
.lang-btn b{font-size:24px;font-weight:700;line-height:1.2}
.lang-btn small{font-size:15px;color:var(--on-cover-2)}
.lang-btn:active{background:var(--cover-line)}

/* setup */
.steps-bar{display:flex;gap:6px;margin-top:14px}
.steps-bar i{flex:1;height:5px;border-radius:3px;background:var(--cover-line)}
.steps-bar i.on{background:var(--gold)}
.q{display:block;font-size:22px;font-weight:700;line-height:1.25}
.qs{margin-top:6px;font-size:15.5px;color:var(--ink-2)}
.su-body{display:grid;gap:14px}
.su-list{display:grid;gap:8px}
.su-list li{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 6px 6px 12px;border-radius:14px;background:var(--paper-2);font-weight:600;font-size:17px}
.su-list li span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.su-nav{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:22px}
.su-nav .btn.line{width:auto;padding:8px 20px}

/* old pages */
.mh{font-size:15px;font-weight:700;color:var(--ink-2);margin:22px 2px 4px}
.mh:first-child{margin-top:0}
.dl{display:grid;grid-template-columns:1.25fr 1fr 1fr 22px;align-items:end;gap:2px 8px;width:100%;padding:12px 2px;border-bottom:1px solid var(--rule)}
.dl .hand{font-size:23px;line-height:1.1;color:var(--pen)}
.dl small{display:block;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl .v{display:block;font-size:17px;font-weight:700;white-space:nowrap}
.dl .st{align-self:center;justify-self:end}
.dl .st.ok{color:var(--cash)} .dl .st.bad{color:var(--out)} .dl .st.mid{color:var(--ink-3)}
.dl .dl-x{grid-column:1/-1;display:flex;align-items:center;gap:6px;margin-top:4px;font-size:14px;font-weight:600;color:var(--out)}
.empty{padding:36px 8px;text-align:center;color:var(--ink-2)}
.more{margin-top:18px}

/* owner */
.oc-l{font-size:14px;color:var(--on-cover-2);margin-top:14px}
.oc-v{font-size:40px;font-weight:700;line-height:1.1;color:var(--gold)}
.own-acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.own-acts .wide{grid-column:1/-1}
.sec{margin-top:28px}
.sec:first-child{margin-top:2px}
.sec h2{font-size:18px;font-weight:700;margin-bottom:6px}
.look{display:flex;align-items:center;gap:10px;min-height:58px;padding:6px 0;border-bottom:1px solid var(--rule)}
.look-main{flex:1;display:flex;align-items:center;gap:10px;min-width:0;min-height:46px;text-align:left}
.look-main>svg{color:var(--out)}
.look-t{flex:1;min-width:0}
.look b{display:block;font-weight:600;font-size:15.5px;line-height:1.25}
.look small{display:block;font-size:13.5px;color:var(--ink-2)}
.look .hand{font-size:17px;color:var(--pen);white-space:nowrap}
.fine{display:flex;align-items:center;gap:8px;color:var(--cash);font-weight:600;font-size:15.5px;min-height:40px}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.mnav b{font-size:18px;font-weight:700}
.mnav button{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--paper-2)}
.mnav button[disabled]{opacity:.35}
.mtot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px;border-radius:14px;background:var(--paper-2)}
.mtot small{display:block;font-size:13px;color:var(--ink-2)}
.mtot b{font-size:18px;font-weight:700;white-space:nowrap}
.tbl-wrap{overflow-x:auto;margin-top:8px}
.tbl{width:100%;border-collapse:collapse;min-width:330px}
.tbl th{font-size:13px;font-weight:500;color:var(--ink-2);text-align:right;padding:8px 4px}
.tbl td{padding:10px 4px;border-top:1px solid var(--rule);text-align:right;font-weight:600;white-space:nowrap;vertical-align:top}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td small{display:block;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.tbl td small.o{color:var(--out)}
.tbl td.o{color:var(--out)}
.mini{font-size:13.5px;color:var(--ink-2);margin-top:10px}
.tool{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;border-bottom:1px solid var(--rule);font-weight:600;font-size:16px}
.tool span{flex:1}
.tool small{display:block;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.tool>svg:first-child{color:var(--pen)}
.tool>svg:last-child{color:var(--ink-3)}
.st-list li{display:flex;align-items:center;gap:10px;min-height:62px;border-bottom:1px solid var(--rule)}
.st-list .nm{flex:1;min-width:0;font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-list .nm small{display:block;font-size:13px;font-weight:500;color:var(--ink-2)}

/* misc */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:40px 28px;text-align:center;color:var(--on-cover)}
.center .logo{align-self:center}
.center p{color:var(--on-cover-2);font-size:16.5px;max-width:32ch}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--cover-line);border-top-color:var(--gold);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:90;transform:translate(-50%,14px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:10px;width:max-content;max-width:min(92vw,500px);padding:8px 8px 8px 16px;min-height:52px;border-radius:16px;background:var(--ink);color:var(--paper);
  font-weight:600;font-size:15.5px;transition:opacity .18s,transform .18s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .tm{flex:1;min-width:0;padding:6px 0}
.toast button{flex:none;min-height:40px;padding:0 14px;border-radius:12px;background:var(--gold);color:var(--gold-ink);font-weight:700}
.toast.nb{padding-right:16px;pointer-events:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-height:640px){
  .sheet.tall .amt-big{min-height:54px;font-size:46px}
  .sheet.tall .keypad{min-height:168px;gap:6px;margin:6px 0 8px}
  .sheet.tall .lock-note{display:none}
}
@media (max-width:350px){
  .cv-strip dd{font-size:17px}
  .ledger{padding-left:28px}
}

/* v3: Google sign-in, Gmail list */
.tabs-in{grid-template-columns:repeat(var(--tabs,3),1fr)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:62px;padding:8px 18px;border-radius:18px;background:#fff;color:#1F1F1F;
  font-weight:700;font-size:18px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.gbtn svg{color:#1A73E8}
.gbtn:active{filter:brightness(.94)}
.sign-help{font-size:14.5px;color:var(--on-cover-2)}
.err.light{color:#FFB4AC}
.center-acts{display:grid;gap:10px;width:100%;max-width:340px;margin-top:6px}
.center p b{color:var(--on-cover)}
.loading-line{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:var(--ink-2);margin:4px 2px 12px}
.spin.sm{width:18px;height:18px;border-width:2.5px;border-color:var(--line);border-top-color:var(--pen)}
.add-box{display:grid;gap:8px;padding:12px;border-radius:16px;background:var(--paper-2)}
.add-box .btn{width:100%}
.su-n{flex:1;min-width:0;overflow:hidden}
.su-n,.su-n small{white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.su-n small{display:block;font-size:13px;font-weight:500;color:var(--ink-2)}
.st-row{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;text-align:left}
.st-list .nm small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.danger-line{border:1.5px solid var(--out);color:var(--out)}
.fact .av{width:28px;height:28px;font-size:12.5px}

/* ═════ v4: a register for a home screen, and an app that feels native ═════ */
body{-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button,a{-webkit-touch-callout:none}
@media (display-mode:standalone){html,body{overscroll-behavior-y:none}}
.tabs{view-transition-name:tabbar}
::view-transition-old(root),::view-transition-new(root){animation-duration:.17s}
.key{transition:transform .07s,background-color .07s}
.key:active{transform:scale(.94)}

/* bottom tabs: a pill behind the active icon, as on Android */
.tab{height:66px;gap:3px;font-size:12.5px}
.tab.on::before{content:none}
.tab .ti{position:relative;display:grid;place-items:center;width:60px;height:32px;border-radius:16px;transition:background-color .2s}
.tab.on .ti{background:var(--paper-3);background:color-mix(in srgb,var(--pen) 16%,transparent)}
.tab:active .ti{background:var(--paper-2)}
.tab .dot{top:1px;left:auto;right:11px;border:2px solid var(--paper);width:12px;height:12px}
.tab .dot.gold{background:var(--gold)}

/* register cover: who, money taken, and the day so far */
.reg-head{padding:8px 16px 30px}
.reg-head .me-chip{max-width:58%}
.out-pill{background:transparent;box-shadow:inset 0 0 0 1.5px var(--cover-line)}
.out-pill svg{color:#FF9C94}
.out-pill:active{background:var(--cover-2)}
.sum{display:flex;align-items:flex-end;gap:14px;width:100%;margin-top:12px;text-align:left;color:var(--on-cover)}
.sum:active{opacity:.82}
.sum-l{flex:1;min-width:0;display:flex;flex-direction:column}
.sum small{font-size:13.5px;color:var(--on-cover-2);white-space:nowrap}
.sum-l b{display:inline-block;align-self:flex-start;font-size:36px;font-weight:700;line-height:1.08;letter-spacing:-.01em;transform-origin:left 70%;white-space:nowrap}
.sum-r{display:flex;flex-direction:column;align-items:flex-end;padding-bottom:3px}
.sum-r b{font-size:19px;font-weight:700;color:var(--gold);white-space:nowrap}
.sum>svg{flex:none;margin-bottom:9px;color:var(--on-cover-2)}

/* register page */
.paper.reg{display:flex;flex-direction:column;padding:10px 16px calc(80px + env(safe-area-inset-bottom,0px))}
.notes-stack.compact{gap:6px;margin-bottom:8px}
.notes-stack.compact .note{padding:8px 12px;font-size:14px;gap:9px}
.notes-stack.compact .note p{display:none}
.reg .warn-line{margin-bottom:4px}

/* the amount, written on a ruled line beside the red margin */
.ra{position:relative;flex:none;display:flex;align-items:flex-end;justify-content:flex-start;height:80px;margin:auto -16px 0;padding:0 16px 11px 34px;
  background:linear-gradient(var(--margin),var(--margin)) 22px 0/1.5px 100% no-repeat,linear-gradient(var(--rule),var(--rule)) 0 calc(100% - 9px)/100% 1.5px no-repeat}
.ra-n{display:inline-flex;align-items:baseline;gap:6px;font-family:var(--hand);font-weight:700;font-size:60px;line-height:1;color:var(--pen);white-space:nowrap}
.ra-r{font-family:var(--ui);font-weight:500;font-size:28px;opacity:.55}
.ra-ph{font-family:var(--hand);font-weight:400;font-size:27px;line-height:1.25;color:var(--ink-3);padding-bottom:2px}
.ra-ph.bad{color:var(--out);font-weight:700}
.ra-n.long{font-size:46px}
.ra.shake .ra-n,.ra.shake .ra-ph,.ra.shake .sbox.on{animation:shake .32s}
.ra.split{gap:10px;align-items:stretch;padding:6px 16px 14px 34px}
.sbox{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:2px 12px;border-radius:14px;border:2px solid var(--line);background:var(--paper);text-align:left}
.sbox.on{border-color:var(--pen);background:var(--paper-2)}
.sbox small{font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sbox b{font-family:var(--hand);font-size:30px;line-height:1.05;color:var(--pen)}
.sbox.ptm b{color:var(--ptm)}
.ra.done{background:none;padding:6px 0;align-items:center}
.rcpt{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:6px 6px 6px 12px;border-radius:16px;background:var(--cash-bg);
  font-weight:600;font-size:15.5px;line-height:1.25;animation:rcIn .32s cubic-bezier(.2,.9,.3,1)}
.rcpt.q{background:#FFF3D1;color:#4A3504}
.rcpt .rc-i{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--cash);color:var(--on-cash)}
.rcpt.q .rc-i{background:#A06A00;color:#fff}
.rcpt .rc-t{flex:1;min-width:0}
.rcpt .rc-u{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:12px;background:var(--paper);color:var(--ink);font-weight:700;border:1.5px solid var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rcpt.q{background:#3A2E10;color:#FFE3A1}}
:root[data-theme="dark"] .rcpt.q{background:#3A2E10;color:#FFE3A1}
@keyframes rcIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}

.qrow{flex:none;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:10px}
.qrow .chip.q{display:flex;justify-content:center;min-height:44px;padding:4px 0 0;font-size:18.5px}
.qrow .chip.q.on{background:var(--pen);border-color:var(--pen);color:var(--paper)}
.ra-split{position:absolute;right:16px;bottom:16px;display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:2px 12px;border-radius:18px;
  border:1.5px dashed var(--ptm);color:var(--ptm);background:var(--paper);font-weight:600;font-size:14px;white-space:nowrap}
.ra-split:active{background:var(--ptm-bg)}
.split-info{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;margin-top:10px}
.split-info .sc{font-weight:600;font-size:15px;color:var(--ink-2)}
.split-info .sc b{font-family:var(--hand);font-size:25px;color:var(--cash);margin-left:4px}
.reg .keypad{flex:1 1 auto;min-height:189px;max-height:292px;gap:7px;margin:10px 0 12px}
.reg .key{min-height:42px}
#app.fit{flex:none;height:100vh;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
#app.fit .paper.reg{min-height:0;overflow-y:auto;overscroll-behavior:contain}

/* one row per person: tapping Cash or the online button in that row saves */
.people{flex:none;display:grid;gap:8px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.18fr) minmax(0,1.18fr);gap:8px;align-items:stretch}
.pname{display:flex;align-items:center;gap:8px;min-width:0;font-weight:700;font-size:16px;line-height:1.15}
.pname>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:56px;padding:4px 6px;border-radius:16px;
  font-weight:700;font-size:17px;line-height:1.1;text-align:center;transition:transform .08s,filter .08s,opacity .18s}
.pbtn .pl{display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
.pbtn .pl>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtn .pm{font-family:var(--hand);font-size:18px;padding-top:2px}
.pbtn small{font-size:13.5px;font-weight:600;opacity:.92}
.pbtn.cash{background:var(--cash);color:var(--on-cash)}
.pbtn.ptm{background:var(--ptm);color:var(--on-ptm)}
.pbtn.split{grid-column:2/4;background:var(--gold);color:var(--gold-ink);flex-direction:row;gap:8px}
.pbtn:active{transform:scale(.96);filter:brightness(.92)}
.people.idle .pbtn{opacity:.42}
.people.solo .prow{grid-template-columns:1fr 1fr}
.people.solo .pname{display:none}
.people.solo .pbtn{min-height:76px;font-size:21px}
.people.solo .pbtn.split{grid-column:1/-1}
.people.grid2{grid-template-columns:1fr 1fr;gap:8px}
.people.grid2 .prow{grid-template-columns:1fr 1fr;gap:4px 5px;padding:5px;border-radius:16px;background:var(--paper-2)}
.people.grid2 .pname{grid-column:1/-1;gap:6px;font-size:14px;line-height:1.1;padding:1px 4px 0}
.people.grid2 .pname .av{width:16px;height:16px;font-size:0}
.people.grid2 .pbtn,.people.grid2 .pbtn{min-height:44px!important;font-size:15px;border-radius:12px}
.people.grid2 .pbtn.split{grid-column:1/-1}
.pother{display:flex;justify-content:center;margin-top:2px}
.pother .link{min-height:40px;font-size:15px}

/* the amount flying up into the day's total after a save */

function num(n) {
  n = Math.round(Number(n) || 0);

  return (n < 0 ? '−' : '') + s;

const tsVal = v => v == null ? null : typeof v === 'number' ? v : typeof v.toMillis === 'function' ? v.toMillis() : null;
function normDoc(id, d, pending) {

  o.at = tsVal(d.at);
  delete o.cancel;
  if (d.cancel) o.void = Object.assign({}, d.cancel, { at: tsVal(d.cancel.at) });

function makeCloud(fb) {
  const auth = fb.auth(), db = fb.firestore(), FV = fb.firestore.FieldValue;
  const docs = q => q.docs.map(d => normDoc(d.id, d.data({ serverTimestamps: 'estimate' }), d.metadata.hasPendingWrites)).filter(Boolean);
  const live = (q, cb, err) => q.onSnapshot({ includeMetadataChanges: true }, s => cb(docs(s), s.metadata), err);
  return {
    stamp: () => FV.serverTimestamp(),
    onUser: cb => auth.onAuthStateChanged(u => cb(u ? { uid: u.uid, email: normEmail(u.email), name: u.displayName || '' } : null)),
    async signIn() {
      const p = new fb.auth.GoogleAuthProvider();
      p.setCustomParameters({ prompt: 'select_account' });
      try { await auth.signInWithPopup(p); }
      catch (e) {
        const c = (e && e.code) || '';
        if (/popup-blocked|operation-not-supported|web-storage-unsupported/.test(c)) return auth.signInWithRedirect(p);
        if (/popup-closed-by-user|cancelled-popup-request/.test(c)) return;
        throw e;
      }
    },
    redirectResult: () => auth.getRedirectResult(),
    signOut: () => auth.signOut(),
    watchShop: (cb, err) => db.doc('shop/main').onSnapshot(s => cb(s.exists ? s.data() : null, s.metadata), err),
    getMember: async e => { const s = await db.doc('members/' + e).get(); return s.exists ? s.data() : null; },
    watchMember: (e, cb, err) => db.doc('members/' + e).onSnapshot(s => cb(s.exists ? s.data() : null), err),
    watchMembers: (cb, err) => db.collection('members').onSnapshot(q => { const o = {}; q.docs.forEach(d => { o[d.id] = d.data(); }); cb(o); }, err),
    setMember: (e, v) => db.doc('members/' + e).set(v, { merge: true }),
    setShop: v => db.doc('shop/main').set(v),
    mergeShop: p => db.doc('shop/main').set(p, { merge: true }),
    watchDay: (dk, cb, err) => live(db.collection('entries').where('dk', '==', dk), cb, err),
    watchCounts: (cb, err) => live(db.collection('counts').orderBy('at', 'desc').limit(40), cb, err),
    watchPtm: (cb, err) => live(db.collection('ptm').orderBy('at', 'desc').limit(60), cb, err),
    async range(col, a, b) { return docs(await db.collection(col).where('dk', '>=', a).where('dk', '<=', b).get()); },

function makeDemo() {

  let data = load();
  const subs = new Set();
  const fire = () => subs.forEach(f => f());
  const save = () => { cols.forEach(k => { try { localStorage.setItem(K + k, JSON.stringify(data[k])); } catch (e) { S.persist = false; } }); setTimeout(fire, 0); };
  try { window.addEventListener('storage', e => { if (e.key && e.key.indexOf(K) === 0) { data = load(); fire(); } }); } catch (e) {}
  try { localStorage.setItem(K + 'probe', '1'); localStorage.removeItem(K + 'probe'); } catch (e) { S.persist = false; }
  const list = col => Object.keys(data[col]).map(id => normDoc(id, data[col][id], false));
  const real = v => JSON.parse(JSON.stringify(v), (k, x) => (x && x.__ts) ? now() : x);
  const sub = f => { subs.add(f); setTimeout(f, 0); return () => subs.delete(f); };
  return {
    stamp: () => ({ __ts: 1 }),
    onUser: cb => setTimeout(() => cb({ uid: 'demo', email: 'demo', name: '' }), 0),
    signIn: async () => {}, redirectResult: async () => null, signOut: async () => {},
    watchShop: cb => sub(() => cb(data.shop, { fromCache: false })),
    getMember: async e => data.members[e] || null,
    watchMember: (e, cb) => sub(() => cb(data.members[e] || null)),
    watchMembers: cb => sub(() => cb(Object.assign({}, data.members))),
    async setMember(e, v) { data.members[e] = merge(data.members[e] || {}, real(v)); save(); },
    async setShop(v) { data.shop = real(v); save(); },
    async mergeShop(p) { data.shop = merge(data.shop || {}, real(p)); save(); },
    watchDay: (dk, cb) => sub(() => cb(list('entries').filter(e => e.dk === dk), {})),
    watchCounts: cb => sub(() => cb(list('counts').sort((a, b) => b.at - a.at).slice(0, 40), {})),
    watchPtm: cb => sub(() => cb(list('ptm').sort((a, b) => b.at - a.at).slice(0, 60), {})),
    async range(col, a, b) { return list(col).filter(x => x.dk >= a && x.dk <= b); },
    async lastCountBefore(dk) { return list('counts').filter(c => c.dk < dk).sort((a, b) => b.dk - a.dk)[0] || null; },
    async add(col, id, v) { data[col][id] = real(v); save(); },
    async patch(col, id, v) { if (!data[col][id]) throw { code: 'not-found' }; data[col][id] = merge(data[col][id], real(v)); save(); }

      if (e.flag && !e.void) add(dk + ':f:' + e.id, { dk, id: e.id, text: t('lk_flag', { r: t('r_' + e.flag.why) }), sub: what });

    });
    if (r.last && r.diff) add(dk + ':d:' + r.last.id, { dk, text: r.diff < 0 ? t('lk_short', { a: rs(-r.diff) }) : t('lk_extra', { a: rs(r.diff) }), sub: t('counted', { t: clock(r.last.at) }) });

}
function monthData(ym) {

  const who = id => { if (!m.by[id]) { m.by[id] = { id, total: 0, n: 0, took: 0, why: {}, voids: 0 }; m.order.push(id); } return m.by[id]; };
  staffList().forEach(s => who(s.id));
  const seenDays = {};
  lists().E.forEach(e => {
    if (e.dk < a || e.dk > b) return;

    if (e.void) { if (e.t === 'pay') who(e.who).voids++; return; }

/* ───────── sheets ───────── */
let sheet = null;
function openSheet(def) {

  }

        st.busy = true; drawSheet();

        catch (err) { st.busy = false; st.err = failText(); drawSheet(); }
      }
    },
    onClose() { clearInterval(def.timer); }
  };
  def.timer = setInterval(() => { if (sheet === def && !st.ask) drawSheet(); }, 1000);
  openSheet(def);
}

/* Count the cash: blind first (type what you count), then compare, then close */
function openCount() {
  const dk = S.todayDk;
  const st = { step: 'type', amt: '', touched: false, notes: {}, coins: '', busy: false, err: '', cid: null, rec: null };
  const notesTotal = () => NOTES.reduce((s, n) => s + n * (Number(st.notes[n]) || 0), 0) + (Number(st.coins) || 0);
  const withRec = () => {
    if (!st.rec || S.counts[st.cid]) return dayCalc(dk);
    S.counts[st.cid] = Object.assign({ id: st.cid }, st.rec); S.ver++;
    const r = dayCalc(dk); delete S.counts[st.cid]; S.ver++;
    return r;
  };
  openSheet({
    cls: 'tall',
    render() {
      const r = withRec();
      if (st.step === 'done') {
        return headHTML(t('dayClosed')) + `<div class="done"><div class="stamp thunk ${r.diff ? 'bad' : ''}"><span>${t('closedStamp')}</span><small>${clock(now())}</small></div>
          <div class="done-nums"><div><small>${t('total')}</small><b>${rs(r.total)}</b></div><div><small>${esc(onl())} (P)</small><b>${rs(r.ptm)}</b></div><div><small>${t('inHand')}</small><b>${rs(r.carry)}</b></div></div>
          ${S.mode === 'cloud' ? `<p>${t('ownerSees')}</p>` : ''}
          <div class="done-acts"><button class="btn gold" data-act="send">${ICON.send}<span>${t('share')}</span></button><button class="btn line" data-act="sheet-close">${t('close')}</button></div></div>`;
      }
      if (st.step === 'notes') {
        return headHTML(t('countNotes')) + `<div class="notes-grid">${NOTES.map(n => `<label class="nrow"><b>₹${n} ×</b><input class="inp" data-keep="n${n}" data-note="${n}" inputmode="numeric" maxlength="4" autocomplete="off" value="${esc(st.notes[n] || '')}" placeholder="0"><span data-sub="${n}">${num(n * (Number(st.notes[n]) || 0))}</span></label>`).join('')}
          <label class="nrow"><b>${t('coins')}</b><input class="inp" data-keep="coins" data-note="coins" inputmode="numeric" maxlength="5" autocomplete="off" value="${esc(st.coins)}" placeholder="0"><span data-sub="coins">${num(Number(st.coins) || 0)}</span></label></div>
          <div class="ntot"><span>${t('total')}</span><b data-ntot>₹${num(notesTotal())}</b></div>
          <div class="btn-row"><button class="btn line" data-act="notes-back">${t('back')}</button><button class="btn navy" data-act="notes-use" data-nuse>${t('useAmt', { a: rs(notesTotal()) })}</button></div>`;
      }
      if (st.step === 'result') {
        const c = st.rec, diff = r.diff;
        let h = headHTML(t('countTitle')) + `<div class="box"><div class="box-row"><span>${t('shouldBe')}</span><b>${rs(r.expAt)}</b></div><div class="box-row"><span>${t('youCounted')}</span><b>${rs(c.counted)}</b></div><hr>`;
        h += diff === 0 ? `<div class="box-row big good"><span>${t('matches')}</span><b>${ICON.checkBig}</b></div>` : `<div class="box-row big bad"><span>${diff < 0 ? t('short', { a: '' }) : t('extra', { a: '' })}</span><b>${rs(Math.abs(diff))}</b></div>`;
        h += `</div>`;
        if (diff) h += `<p class="why">${t(diff < 0 ? 'shortWhy' : 'extraWhy')}</p>`;
        h += `<div style="flex:1"></div>` + (st.err ? `<p class="err" role="alert">${esc(st.err)}</p>` : '');
        h += `<div class="e-acts" style="margin-top:16px">${diff ? `<button class="btn line" data-act="again">${t('countAgain')}</button>` : ''}<button class="btn ${diff ? 'red' : 'navy'}" data-act="close-day" ${st.busy ? 'disabled' : ''}>${ICON.lock}<span>${diff === 0 ? t('closeDay') : diff < 0 ? t('closeShort', { a: rs(-diff) }) : t('closeExtra', { a: rs(diff) })}</span></button></div>`;
        return h;
      }
      const amt = Number(st.amt) || 0;
      return headHTML(t('countTitle')) + `<p class="ask">${t('countAsk')}</p>
        <div class="amt-big ${st.touched ? '' : 'empty'}" aria-live="polite"><span class="r">₹</span><span class="n">${num(amt)}</span></div>
        <div class="sub-acts"><button class="link" data-act="notes">${ICON.coins}${t('countNotes')}</button></div>
        ${keypadHTML('00')}${st.err ? `<p class="err" role="alert">${esc(st.err)}</p>` : ''}
        <button class="btn navy" data-act="check" ${st.touched && !st.busy ? '' : 'disabled'}><span>${st.touched ? t('check') : t('typeCount')}</span></button>`;
    },
    key(k) { if (st.step === 'type' && !st.busy) { if (k === 'enter') return this.on('check'); this.on('key', { dataset: { key: k } }); } },
    input(el) {
      const n = el.dataset.note; if (!n) return;
      el.value = digits(el.value);
      if (n === 'coins') st.coins = el.value; else st.notes[n] = el.value;
      const sub = $('[data-sub="' + n + '"]', root); if (sub) sub.textContent = num(n === 'coins' ? Number(st.coins) || 0 : Number(n) * (Number(el.value) || 0));
      const tot = $('[data-ntot]', root); if (tot) tot.textContent = '₹' + num(notesTotal());
      const use = $('[data-nuse]', root); if (use) use.textContent = t('useAmt', { a: rs(notesTotal()) });
    },
    async on(act, el) {
      if (st.busy) return;
      if (act === 'send') return openShare(dk);
      if (act === 'key') { st.amt = typeKey(st.amt, el.dataset.key, 7); st.touched = el.dataset.key === 'back' ? st.amt !== '' : true; }
      else if (act === 'notes') st.step = 'notes';
      else if (act === 'notes-back') st.step = 'type';
      else if (act === 'notes-use') { st.amt = String(notesTotal() || ''); st.touched = true; st.step = 'type'; }
      else if (act === 'again') { st.step = 'type'; st.amt = ''; st.touched = false; st.notes = {}; st.coins = ''; st.rec = null; st.cid = null; }
      else if (act === 'check') {
        if (!st.touched) return;
        if (!online()) { st.err = t('needNet'); return drawSheet(); }
        st.busy = true; st.err = ''; drawSheet();
        const cid = uid(), counted = Number(st.amt) || 0, expected = dayCalc(dk).expected;
        try {
          await withTimeout(S.store.add('counts', cid, Object.assign({ dk, counted, expected, dev: DEVICE }, stampOf())), 15000);
          st.cid = cid; st.rec = { dk, at: S.counts[cid] ? S.counts[cid].at : now(), counted, expected, by: S.user.uid };
          st.busy = false; st.step = 'result';
        } catch (err) { st.busy = false; st.err = failText(); }
      }
      else if (act === 'close-day') {
        if (!online()) { st.err = t('needNet'); return drawSheet(); }
        st.busy = true; st.err = ''; drawSheet();
        try { await withTimeout(S.store.patch('counts', st.cid, { closed: S.store.stamp() }), 15000); st.busy = false; st.step = 'done'; buzz(); render(); }
        catch (err) { st.busy = false; st.err = failText(); }
      }
      drawSheet();
    }
  });
}

/* Share a page as text (WhatsApp or copy) */
function summaryText(dk) {
  const r = dayCalc(dk), by = {}, order = [];
  r.list.forEach(e => { if (e.t === 'pay' && !e.void) { if (!by[e.who]) { by[e.who] = { n: whoName(e), a: 0, c: 0 }; order.push(e.who); } by[e.who].a += e.amt; by[e.who].c++; } });
  const out = [(S.shop.name || 'Salon') + ', ' + handDate(dk) + ' (' + weekday(dk) + ')', ''];
  order.forEach(id => out.push(by[id].n + ': ' + rs(by[id].a) + ' (' + by[id].c + ')'));
  out.push('', t('total') + ': ' + rs(r.total), onl() + ' (P): ' + rs(r.ptm), t('cash') + ': ' + rs(r.cash));
  r.list.forEach(e => { if (e.t !== 'pay' && !e.void) out.push((e.t === 'own_in' ? '+ ' : '− ') + rs(e.amt) + ' ' + whoName(e) + (e.why ? ' (' + t('r_' + e.why) + ')' : '')); });
  out.push(t('earlier') + ': ' + rs(r.opening), t(r.last ? 'shouldBe' : 'inHand') + ': ' + rs(r.expected));
  if (r.last) out.push(t('counted', { t: clock(r.last.at) }) + ': ' + rs(r.last.counted) + (r.diff === 0 ? ' ✓' : ' (' + (r.diff < 0 ? t('short', { a: rs(-r.diff) }) : t('extra', { a: rs(r.diff) })) + ')'));
  else if (dk < S.todayDk) out.push(t('lk_notCounted'));
  if (r.voids) out.push(t('nCancelled', { n: r.voids }));
  return out.join('\n');
}
function openShare(dk) {
  const text = summaryText(dk);
  openSheet({
    render: () => headHTML(t('shareTitle')) + `<textarea class="ta" readonly>${esc(text)}</textarea><div class="e-acts">
      <a class="btn green" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">${ICON.send}<span>${t('whatsapp')}</span></a>
      <button class="btn line" data-act="copy">${t('copyText')}</button>${navigator.share ? `<button class="btn line" data-act="more">${t('moreApps')}</button>` : ''}</div>`,
    async on(act) {
      if (act === 'copy') {
        let ok = false;
        try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {}
        if (!ok) { const ta = $('.ta', root); if (ta) { try { ta.focus(); ta.select(); ok = document.execCommand('copy'); } catch (e) {} } }
        if (ok) toast(ICON.check + ' ' + t('copied'));
      }
      if (act === 'more') { try { await navigator.share({ text }); } catch (e) {} }
    }
  });
}

        if (nameTaken(name)) { st.err = t('dupName', { n: name }); return drawSheet(); }
        if (email && !okEmail(email)) { st.err = t('badEmail'); return drawSheet(); }
        if (taken(email)) { st.err = t('emailTaken'); return drawSheet(); }
        const id = 's' + uid();
        const ok = await run(async () => {
          await S.store.mergeShop({ staff: { [id]: { name, order: now(), active: true, addedAt: now(), email: email || null } } });
          if (email) await S.store.setMember(email, { name, staff: id, active: true, addedAt: now() });
        });
        if (ok) { const a = $('[data-keep="stadd"]', root), b = $('[data-keep="stmail"]', root); if (a) a.value = ''; if (b) b.value = ''; }
      }
      else if (act === 'edit') { st.edit = el.dataset.id; st.err = ''; }
      else if (act === 'edit-save') {
        const s = staffById(st.edit), ni = $('[data-keep="ename"]', root), name = ni ? ni.value.trim().replace(/\s+/g, ' ').slice(0, 16) : '', email = readEmail('[data-keep="email"]');
        if (!name) return;
        if (nameTaken(name, s.id)) { st.err = t('dupName', { n: name }); return drawSheet(); }
        if (email && !okEmail(email)) { st.err = t('badEmail'); return drawSheet(); }
        if (email !== (s.email || '') && taken(email, s.id)) { st.err = t('emailTaken'); return drawSheet(); }
        const ok = await run(async () => {
          await S.store.mergeShop({ staff: { [s.id]: { name, email: email || null } } });
          if (s.email && s.email !== email) await S.store.setMember(s.email, { active: false });
          if (email) await S.store.setMember(email, { name, staff: s.id, active: true, addedAt: now() });
        });
        if (ok) st.edit = null;
      }
      else if (act === 'left') { if (staffList().length < 2) { st.err = t('needOne'); st.edit = null; } else { st.ask = el.dataset.id; st.edit = null; st.err = ''; } }
      else if (act === 'left-yes') {
        const s = staffById(st.ask);
        const ok = await run(async () => {
          await S.store.mergeShop({ staff: { [s.id]: { active: false, leftAt: now() } } });
          if (s.email) await S.store.setMember(s.email, { active: false });
        });
        if (ok) st.ask = null;
      }
      else if (act === 'back') {
        const s = staffById(el.dataset.id);
        await run(async () => {
          await S.store.mergeShop({ staff: { [s.id]: { active: true, leftAt: null } } });
          if (s.email && !taken(s.email, s.id)) await S.store.setMember(s.email, { name: s.name, staff: s.id, active: true });
        });
      }
      else if (act === 'add-login') {
        const email = readEmail('[data-keep="lgmail"]');
        if (!okEmail(email)) { st.err = t('badEmail'); return drawSheet(); }
        if (taken(email)) { st.err = t('emailTaken'); return drawSheet(); }
        if (await run(() => S.store.setMember(email, { name: '', staff: null, active: true, addedAt: now() }))) { const i = $('[data-keep="lgmail"]', root); if (i) i.value = ''; }
      }
      else if (act === 'rm-login') await run(() => S.store.setMember(el.dataset.e, { active: false }));
      else if (act === 'no') { st.ask = null; st.edit = null; st.err = ''; }
      drawSheet(); render();
    }
  });
}
function openHelp() {
  openSheet({
    render: () => headHTML(t('helpTitle')) + `<ol class="steps">${[1, 2, 3, 4].map(i => `<li><span class="tn">${i}</span><span>${t('help' + i)}</span></li>`).join('')}</ol>
      <div class="note">${ICON.users}<div><b>${t('helpLeave')}</b></div></div><button class="btn line" data-act="sheet-close" style="margin-top:16px">${t('close')}</button>`
  });
}
function openSalon() {
  const st = { err: '' };
  openSheet({
    render: () => headHTML(t('salonName')) + `<input class="inp big" data-keep="salon" data-enter="save" maxlength="30" autocomplete="off" value="${esc(S.shop.name || '')}">`

}
function openOnline() {
  const st = { err: '' };
  openSheet({
    render: () => headHTML(t('onlineName')) + `<div class="e-acts">${ONLINE_CHOICES.map(c => `<button class="btn ${c === onl() ? 'navy' : 'line'}" data-act="pick" data-c="${esc(c)}">${esc(c)} (P)</button>`).join('')}</div>` + (st.err ? `<p class="err">${esc(st.err)}</p>` : ''),
    async on(act, el) {
      if (act !== 'pick' || !S.isOwner) return;
      try { await withTimeout(S.store.mergeShop({ online: el.dataset.c }), 12000); closeSheet(); render(); } catch (e) { st.err = failText(); drawSheet(); }
    }
  });
}
function monthCSV(ym) {
  const [a, b] = ymRange(ym);
  const cell = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const type = { pay: 'Payment', out: 'Money taken', own_out: 'Owner took cash', own_in: 'Owner added cash' };
  const rows = [['Date', 'Time', 'Type', 'Name', 'Amount', 'Cash or online', 'Reason', 'Written by', 'Marked wrong', 'Cancelled']];
  for (let dk = a; dk <= Math.min(b, S.todayDk); dk = dkAdd(dk, 1)) {
    if (!dayHas(dk)) continue;
    const r = dayCalc(dk), date = dkY(dk) + '-' + pad2(dkM(dk)) + '-' + pad2(dkD(dk));
    r.list.forEach(e => rows.push([date, clock(e.at), type[e.t] || e.t, e.t === 'own_out' || e.t === 'own_in' ? 'Owner' : e.who === 'shop' ? 'Shop expense' : whoName(e), e.amt,
      e.t === 'pay' ? (e.mode === 'ptm' ? onl() : 'Cash') : 'Cash', e.why ? STR.en['r_' + e.why] : '', e.email || '',
      e.flag ? STR.en['r_' + e.flag.why].replace('{p}', onl()) : '', e.void ? (e.void.self ? 'By writer ' : 'By owner ') + clock(e.void.at) : '']));
    rows.push([date, '', 'Page total', '', r.total, onl() + ' ' + r.ptm + ', Cash ' + r.cash, 'Earlier cash ' + r.opening + ', should be ' + r.expected, r.last ? 'Counted ' + r.last.counted : 'Not counted', '', '']);
  }
  return '\uFEFF' + rows.map(r => r.map(cell).join(',')).join('\r\n');
}
function downloadMonth() {
  const ym = S.ownerYm || ymOf(S.todayDk), csv = monthCSV(ym);
  try {
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    const a = document.createElement('a'); a.href = url; a.download = 'salon-copy-' + ym + '.csv'; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
  } catch (e) {
    openSheet({ render: () => headHTML(t('download', { m: esc(monthName(ym)) })) + `<textarea class="ta" readonly>${esc(csv)}</textarea><button class="btn line" data-act="sheet-close">${t('close')}</button>` });
  }
}

/* ───────── setup ───────── */
function setupErr(msg) { S.setup.err = msg; render(); }
function setupAdd() {
  const ni = $('#su-add'), mi = $('#su-mail'); if (!ni) return;
  const name = ni.value.trim().replace(/\s+/g, ' ').slice(0, 16), email = mi ? normEmail(mi.value) : '';
  if (!name) { ni.focus(); return; }
  if (S.setup.staff.some(p => p.name.toLowerCase() === name.toLowerCase())) return setupErr(t('dupName', { n: name }));
  if (email && !okEmail(email)) return setupErr(t('badEmail'));
  if (email && S.setup.staff.some(p => p.email === email)) return setupErr(t('emailTaken'));
  S.setup.staff.push({ name, email }); S.setup.err = ''; S.setup.dn = ''; S.setup.dm = ''; render();
  const again = $('#su-add'); if (again) again.focus();
}
function setupNext() {
  const s = S.setup;
  if (s.step === 2) { const inp = $('#su-add'); if (inp && inp.value.trim()) { setupAdd(); if (s.err) return; } if (!s.staff.length) return setupErr(t('eStaff')); }
  s.err = ''; s.step = Math.min(3, s.step + 1); render(); window.scrollTo(0, 0);
}
function setupKey(k) { const s = S.setup; if (s.step === 3) { s.cash = typeKey(s.cash, k, 8); render(); } }
async function setupSave() {
  const s = S.setup;
  if (s.busy) return;
  s.busy = true; s.err = ''; render();
  const staff = {}, ids = [];
  s.staff.forEach((p, i) => { const id = 's' + i + uid(); ids.push(id); staff[id] = { name: p.name, order: i + 1, active: true, addedAt: now(), email: p.email || null }; });
  const shop = { v: 3, name: s.name.trim() || 'Salon', staff, openingCash: Number(s.cash) || 0, online: 'Paytm', owners: [S.user.email], startDk: todayDk(), createdAt: now() };
  try {
    const existing = await withTimeout(S.store.getMember(S.user.email).catch(() => null), 8000);
    if (existing && existing.active !== false) throw { code: 'not-owner' };
    await withTimeout(S.store.setShop(shop), 15000);
    for (let i = 0; i < s.staff.length; i++) if (s.staff[i].email) await withTimeout(S.store.setMember(s.staff[i].email, { name: s.staff[i].name, staff: ids[i], active: true, addedAt: now() }), 15000);
  } catch (e) {
    const c = (e && e.code) || '';
    s.err = /permission|not-owner/.test(c) ? t('ownerOnlySetup', { e: S.user.email }) : failText();
  }
  s.busy = false; render(); window.scrollTo(0, 0);
}

/* ───────── taps ───────── */
function goTab(tab, day) {
  const run = () => { S.tab = tab; S.viewDay = day || null; render(); window.scrollTo(0, 0); };
  if (S.tab === tab && (S.viewDay || null) === (day || null)) return run();
  if (document.startViewTransition && !REDUCED() && !sheet) { try { document.startViewTransition(run); return; } catch (e) {} }
  run();
}
/* app shortcuts on the home-screen icon: ?a=out, ?a=today, ?a=count */
let startDone = false;
function runStartAct() {
  if (startDone || S.phase !== 'app') return;
  startDone = true;
  if (START === 'today') goTab('today');
  else if (START === 'out') openMoney('out');
  else if (START === 'count') { goTab('today'); openCount(); }
}
const ACT = {
  'pick-lang'(el) { S.lang = el.dataset.l; lsSet('lang', S.lang); render(); },
  signin() { S.signErr = ''; S.store.signIn().catch(() => { S.signErr = t('signFail'); render(); }); },
  signout: doSignOut,
  retry() { if (S.user) startAccess(); },
  account: openAccount,
  tab(el) {
    const to = el.dataset.tab;
    goTab(to);
    if (to === 'pages') loadMonth(S.pagesYm || ymOf(S.todayDk));
    if (to === 'owner') loadOwner();
  },
  lang: openLang,
  pay() { goTab('reg'); },
  out() { openMoney('out'); },
  'tips-ok'() { lsSet('tips', '1'); render(); },
  'refused-ok'() { S.refused = []; render(); },
  entry(el) { if (S.entries[el.dataset.id]) openEntry(Number(el.dataset.dk), el.dataset.id); },
  count() { openCount(); },
  'share-day'(el) { openShare(Number(el.dataset.dk)); },
  'open-day'(el) { const dk = Number(el.dataset.dk); goTab('pages', dk); loadFor(async () => { await ensureOpening(dk); await ensureSpan(dk, dk); }); },
  'back-pages'() { goTab('pages'); },
  'pages-month'(el) { const ym = ymAdd(S.pagesYm || ymOf(S.todayDk), Number(el.dataset.d)); if (ym > ymOf(S.todayDk)) return; S.pagesYm = ym; render(); loadMonth(ym); },
  'owner-month'(el) { const ym = ymAdd(S.ownerYm || ymOf(S.todayDk), Number(el.dataset.d)); if (ym > ymOf(S.todayDk)) return; S.ownerYm = ym; render(); loadFor(async () => { const r = ymRange(ym); await ensureSpan(r[0], Math.min(r[1], dkAdd(S.todayDk, -1))); }); },
  'own-out'() { if (S.isOwner) openMoney('own_out'); },
  'own-in'() { if (S.isOwner) openMoney('own_in'); },
  'ptm-check'(el) { if (S.isOwner) openPtmCheck(Number(el.dataset.dk)); },
  seen(el) { const s = seenMap(); s[el.dataset.key] = Date.now(); lsSet('seen', JSON.stringify(s)); render(); },
  staff() { if (S.isOwner) openStaff(); },
  help: openHelp,
  salon() { if (S.isOwner) openSalon(); },
  online() { if (S.isOwner) openOnline(); },
  csv() { if (S.isOwner) downloadMonth(); },
  'su-next': setupNext,
  'su-back'() { const s = S.setup; s.err = ''; s.step = Math.max(1, s.step - 1); render(); },
  'su-add': setupAdd,
  'su-rm'(el) { S.setup.staff.splice(Number(el.dataset.i), 1); render(); },
  'su-done': setupSave,
  key(el) { if (S.phase === 'setup') setupKey(el.dataset.key); else if (S.phase === 'app' && S.tab === 'reg') regKey(el.dataset.key); },
  quick(el) { R.amt = el.dataset.a; R.last = null; R.err = ''; render(); },
  rsave(el) { regSave(el.dataset.who, el.dataset.m, 0); },
  'split-on'() { R.split = true; R.field = Number(R.amt) ? 'ptm' : 'amt'; R.err = ''; R.last = null; render(); },
  'split-off'() { R.split = false; R.ptm = ''; R.field = 'amt'; R.err = ''; render(); },
  field(el) { R.field = el.dataset.f; R.err = ''; render(); },
  others() { R.others = !R.others; render(); },
  'undo-last'() { const L = R.last; if (!L) return; R.last = null; clearTimeout(R.timer); render(); cancelOwn(L.ids); },
  install: doInstall,
  'install-later'() { lsSet('noInstall', '1'); render(); }
};
let keyDownAt = 0;
document.addEventListener('pointerdown', ev => {
  if (ev.button > 0 || !ev.target.closest) return;
  const k = ev.target.closest('.key[data-act="key"]');
  if (k) { keyDownAt = performance.now(); buzz(7); dispatch(k, ev); return; }
  const h = ev.target.closest('.grab-z, .sh-head');
  if (h && sheet && root.contains(h) && !ev.target.closest('button, a, input')) startDrag(h, ev);
}, { passive: true });
document.addEventListener('click', ev => {
  const el = ev.target.closest && ev.target.closest('[data-act]');
  if (!el) return;
  if (el.dataset.act === 'key' && performance.now() - keyDownAt < 700) return;
  dispatch(el, ev);
});
function dispatch(el, ev) {
  const act = el.dataset.act;
  if (toastEl.contains(el)) { const cb = toastCb; hideToast(); if (cb) cb(); return; }
  if (root.contains(el)) {
    if (act === 'sheet-bg') { if (ev.target === el) { closeSheet(); render(); } return; }
    if (act === 'sheet-close') { closeSheet(); render(); return; }
    if (sheet && sheet.on) sheet.on(act, el, ev);
    return;
  }
  if (ACT[act]) ACT[act](el, ev);
}
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset && el.dataset.su) S.setup[el.dataset.su] = el.value;
  else if (sheet && sheet.input && root.contains(el)) sheet.input(el);
});
document.addEventListener('keydown', ev => {
  const el = ev.target, typing = el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA');
  if (ev.key === 'Enter' && typing) {
    if (el.id === 'su-add') { ev.preventDefault(); const m = $('#su-mail'); if (m) m.focus(); }
    else if (el.id === 'su-mail') { ev.preventDefault(); setupAdd(); }
    else if (el.id === 'su-name') { ev.preventDefault(); setupNext(); }
    else if (el.dataset.enter && sheet && sheet.on) { ev.preventDefault(); sheet.on(el.dataset.enter, el, ev); }
    else if (el.blur) el.blur();
    return;
  }
  if (typing || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const k = /^\d$/.test(ev.key) ? ev.key : ev.key === 'Backspace' ? 'back' : ev.key === 'Enter' ? 'enter' : null;
  if (!sheet) {
    if (k && k !== 'enter' && S.phase === 'setup' && S.setup.step === 3) { ev.preventDefault(); setupKey(k); }
    else if (k && k !== 'enter' && S.phase === 'app' && S.tab === 'reg') { ev.preventDefault(); regKey(k); }
    return;
  }
  if (ev.key === 'Escape') { closeSheet(); render(); return; }
  if (!sheet.key || !k) return;
  if (k === 'enter' && el && el.tagName === 'BUTTON') return;
  ev.preventDefault(); sheet.key(k);
});

/* a new salon day (4 am) gets a new page */
function checkDay() {
  if (S.phase !== 'app' || !S.dataStarted) return;
  const dk = todayDk();
  if (dk !== S.todayDk) { S.todayDk = dk; S.viewDay = null; R.last = null; subscribeDay(); loadFor(() => ensureOpening(dk)); }
}
setInterval(checkDay, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { syncClock(); checkDay(); render(); } });
window.addEventListener('online', () => { S.online = true; render(); });
window.addEventListener('offline', () => { S.online = false; render(); });

/* ───────── start ───────── */
async function syncClock() {
  if (S.mode !== 'cloud' || !/^https?:/.test(location.protocol)) return;
  try {
    const t0 = Date.now();
    const r = await withTimeout(fetch(location.href.split('#')[0], { method: 'HEAD', cache: 'no-store' }), 6000);
    const t1 = Date.now(), h = r.headers.get('date');
    if (!h) return;
    const off = Date.parse(h) + 500 - (t0 + t1) / 2;
    if (!isFinite(off) || Math.abs(off) > 400 * 864e5) return;
    const was = CLK.off;
    CLK.off = Math.abs(off) > 120e3 ? off : 0; CLK.fixed = CLK.off !== 0;
    if (was !== CLK.off) { S.ver++; checkDay(); render(); }
  } catch (e) {}
}
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.crossOrigin = 'anonymous'; s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
async function boot() {
  render();
  if (S.mode === 'demo') {
    S.store = makeDemo();
    S.store.onUser(u => { S.user = u; startAccess(); });
    return;
  }
  try {
    for (const f of ['app', 'auth', 'firestore']) await withTimeout(loadScript(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-${f}-compat.js`), 20000);
    window.firebase.initializeApp(FIREBASE_CONFIG);
    try { await window.firebase.firestore().enablePersistence({ synchronizeTabs: true }); } catch (e) {}
  } catch (e) { S.phase = 'noload'; return render(); }
  S.store = makeCloud(window.firebase);
  await Promise.race([syncClock(), sleep(3000)]);
  S.store.redirectResult().catch(() => { S.signErr = t('signFail'); render(); });
  S.store.onUser(u => {
    if (!u) { stopAll(); S.user = null; S.phase = 'signin'; return render(); }
    S.user = u; startAccess();
  });
}
boot();
/* the app shell is kept on the phone, so the copy opens even with no internet */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
})();
